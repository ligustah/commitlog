\* Verified configuration: keys carry the writer stamp and deletes are fenced.
SPECIFICATION Spec

CONSTANTS
    Writers = {"w1", "w2"}
    MaxGen = 2
    MaxEpoch = 2
    Stamped = TRUE
    FencedDelete = TRUE
    LineageReclaim = TRUE

INVARIANTS
    TypeOK
    NoClobber
    MarkerIntegrity
    ReadCorrect
    ReclaimAttributable
    EveryOrphanReclaimable
