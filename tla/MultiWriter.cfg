\* Keys made disjoint per writer and deletes fenced — what a design SAFE under
\* concurrent writers would look like. commitlog does not do this; the config is
\* here to show the overwrite is a property of DETERMINISTIC keys rather than of
\* concurrency itself, which is why unique-per-upload keys fix it.
SPECIFICATION Spec

CONSTANTS
    Writers = {"w1", "w2"}
    MaxGen = 2
    MaxEpoch = 2
    Stamped = TRUE
    FencedDelete = TRUE
    LineageReclaim = TRUE

INVARIANTS
    TypeOK
    NoClobber
    MarkerIntegrity
    ReadCorrect
    ReclaimAttributable
    EveryOrphanReclaimable
