\* Teeth: stamped keys, but deletes that ignore the stamp. A writer acting on
\* a stale view of ownership reclaims what its own markers call garbage, and
\* removes an object another writer is serving.
\* Expected: MarkerIntegrity violated (nothing left to recover).
SPECIFICATION Spec

CONSTANTS
    Writers = {"w1", "w2"}
    MaxGen = 2
    Stamped = TRUE
    FencedDelete = FALSE

INVARIANTS
    TypeOK
    NoClobber
    MarkerIntegrity
    ReadCorrect
    ReclaimAttributable
