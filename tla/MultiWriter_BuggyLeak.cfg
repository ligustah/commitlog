\* Teeth: stamped keys and fenced deletes, but WITHOUT the rule that a writer
\* may reclaim keys its own marker named. After an identity change every object
\* already in the tier carries the previous stamp.
\* Expected: EveryOrphanReclaimable violated (a permanent, growing leak).
SPECIFICATION Spec

CONSTANTS
    Writers = {"w1", "w2"}
    MaxGen = 2
    MaxEpoch = 2
    Stamped = TRUE
    FencedDelete = TRUE
    LineageReclaim = FALSE

INVARIANTS
    TypeOK
    NoClobber
    MarkerIntegrity
    ReadCorrect
    ReclaimAttributable
    EveryOrphanReclaimable
