\* Same offload spec but with an eviction that ignores pin counts
\* (BuggyEvict = TRUE): it keeps only the MRU `Budget` indexes and drops the
\* rest even when a live seek still holds them. TLC is EXPECTED to report a
\* PinnedStaysCached violation -- evicting an index out from under an in-flight
\* seek, the corruption the pin count in RemoteIndexCache prevents.
SPECIFICATION Spec

CONSTANTS
    NumSegs = 3
    RecPerSeg = 2
    Budget = 2
    MaxRefs = 2
    BuggyEvict = TRUE

INVARIANT TypeOK
INVARIANT CacheStructOK
INVARIANT PinnedStaysCached
