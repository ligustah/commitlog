\* Same compaction spec but with the transaction-blind scan that counts an
\* aborted record as latest-per-key (BuggyAborted = TRUE). TLC is EXPECTED to
\* report a violation here — an aborted record surviving compaction
\* (NoAbortedBelowCeiling) and/or shadowing a committed value (ViewPreserved),
\* the H1 regression the aborted-shadowing fix prevents.
SPECIFICATION Spec

CONSTANTS
    Keys = {ka, kb}
    Vals = {va, vb}
    NoKey = nokey
    MaxLen = 5
    Ceiling = 4
    StripBelow = 4
    GCBelow = 4
    GcActive = TRUE
    BuggyAborted = TRUE

INVARIANT TypeOK
INVARIANT ViewPreserved
INVARIANT NoAbortedBelowCeiling
