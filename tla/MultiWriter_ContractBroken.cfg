\* What commitlog ACTUALLY does when its single-writer contract is broken:
\* deterministic keys, so two writers that each believe they own the tier read
\* the same generation from their own local markers and both write the next one
\* to the SAME key.
\*
\* Not a bug in the log — the cost of the contract, stated exactly, so that the
\* obligation on the caller is backed by a counterexample rather than a warning.
\* Expected: NoClobber violated (a silent lost update, no error to either side).
SPECIFICATION Spec

CONSTANTS
    Writers = {"w1", "w2"}
    MaxGen = 2
    MaxEpoch = 2
    Stamped = FALSE
    FencedDelete = TRUE
    LineageReclaim = TRUE

INVARIANTS
    TypeOK
    NoClobber
    MarkerIntegrity
    ReadCorrect
    ReclaimAttributable
    EveryOrphanReclaimable
