\* Teeth: the pre-stamp key, generation only. Two writers that each believe
\* they own the tier read the same generation from their own local markers and
\* both write the next one to the SAME key.
\* Expected: NoClobber violated (a silent lost update).
SPECIFICATION Spec

CONSTANTS
    Writers = {"w1", "w2"}
    MaxGen = 2
    Stamped = FALSE
    FencedDelete = TRUE

INVARIANTS
    TypeOK
    NoClobber
    MarkerIntegrity
    ReadCorrect
    ReclaimAttributable
