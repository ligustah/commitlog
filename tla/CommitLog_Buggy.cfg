\* Same core spec but with the OLD amputating RecoverTail (BuggyRecovery = TRUE).
\* TLC is EXPECTED to report a CommittedPrefixStability violation here: this is
\* the stale-checkpoint data loss the real RecoverTail was written to prevent.
\* It demonstrates the invariant actually discriminates a correct recovery from
\* a broken one.
SPECIFICATION Spec

CONSTANTS
    MaxOffset = 3
    Vals = {v1, v2}
    BuggyRecovery = TRUE

INVARIANT TypeOK
INVARIANT Contiguity
INVARIANT CommittedPrefixStability
INVARIANT RecoverySoundness
INVARIANT Durability
