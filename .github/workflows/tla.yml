name: TLA+ (manual)

# The TLA+ specs are a one-off confidence pass, deliberately NOT wired into the
# push/PR gate (see tla/README.md). This workflow makes the TLC model check
# runnable on demand — a spec edit, or a periodic re-verification — without
# gating everyday commits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    name: TLC model check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch tla2tools
        working-directory: tla
        run: |
          curl -fL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: "Verify specs (expect: no error found)"
        working-directory: tla
        run: |
          for spec in CommitLog Compaction Offload; do
            echo "::group::$spec"
            out="$(java -cp tla2tools.jar tlc2.TLC -workers auto \
                     -config "$spec.cfg" "$spec.tla" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            grep -q "No error has been found" <<<"$out" || {
              echo "ERROR: $spec.cfg exited 0 without TLC's success line"
              exit 1
            }
            echo "::endgroup::"
          done

      # Asserting WHICH invariant the counterexample violates, not merely that
      # TLC exited non-zero: a parse error or a bad config also exits non-zero,
      # and would otherwise masquerade as proof the invariants still have teeth.
      - name: "Buggy configs (expect: the matching invariant violated)"
        working-directory: tla
        run: |
          check() {
            spec="$1"; want="$2"
            echo "::group::${spec}_Buggy (expecting: $want)"
            out="$(java -cp tla2tools.jar tlc2.TLC -workers auto \
                     -config "${spec}_Buggy.cfg" "$spec.tla" 2>&1 || true)"
            echo "$out"
            if ! grep -Eq "Invariant ($want) is violated" <<<"$out"; then
              echo "ERROR: ${spec}_Buggy.cfg did not report a violation of: $want"
              exit 1
            fi
            echo "OK: ${spec}_Buggy.cfg violated $want as expected"
            echo "::endgroup::"
          }
          check CommitLog  "CommittedPrefixStability"
          check Compaction "ViewPreserved|NoAbortedBelowCeiling"
          check Offload    "PinnedStaysCached"
