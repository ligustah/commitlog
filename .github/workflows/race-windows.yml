name: Race (Windows)

# The race detector never runs on Windows anywhere else. `race (ubuntu)` in
# ci.yml is Linux-only, and `test (windows-latest)` runs without -race, so the
# combination is a hole — and it is the hole most likely to hold something,
# because every platform-specific defect this log has had was a Windows one:
# the mmap flush/truncate ordering, and the just-killed-handle window that
# breaks reads as well as writes.
#
# It lives on a schedule rather than in ci.yml because it is slow: the full
# suite takes about 12 minutes under -race locally and this runner is slower
# again. Per push that would roughly double the wait for everyone; nightly it
# costs nothing (public repo, free runners) and nobody is waiting on it. Same
# reasoning as Fuzz (deep), and the same shape.
#
# It runs the WHOLE suite rather than a curated list of concurrency tests. A
# curated list is faster and silently stops covering what it used to as tests
# are added and renamed, which is the failure mode guardcheck exists to catch
# elsewhere; there is no equivalent alarm here, so there is no list.
on:
  schedule:
    - cron: '43 2 * * *' # nightly, off the hour and clear of Fuzz (deep) at 03:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-windows
  cancel-in-progress: false

jobs:
  race:
    name: race (windows)
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # -race needs cgo and a C compiler. The runner image ships mingw-w64, but
      # if that ever stops being true the race build fails with a linker error
      # that says nothing about the cause, so record what was found first.
      - name: Toolchain
        run: |
          go env CGO_ENABLED CC
          gcc --version

      - name: Test (race)
        run: go test -race -count=1 -timeout=90m ./...
