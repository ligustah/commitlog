name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets a run be aimed at any ref, which on 2026-08-06 there was no way to do.
  # Actions was down for the whole afternoon and came back without ever creating
  # a run for the release commit; tags do not match the branches filter above, so
  # the tagged tree could not be tested at all except by pushing a LATER commit
  # and arguing that a superset passing covers it. This makes "run CI on
  # v0.59.0" a thing that can simply be done.
  workflow_dispatch:

permissions:
  contents: read

# Every setup-go in this file reads this, and it is setup-go's spelling of the
# version go.mod pins in its `toolchain` line. The two are kept in step by hand,
# here and in fuzz-deep.yml.
#
# That hand-sync is now REMOVABLE and was not before. It existed because a
# prerelease spells itself differently on each side — go.mod said
# `toolchain go1.27rc2` while setup-go wanted `1.27.0-rc.2` and could not
# resolve the other form — which ruled out `go-version-file: go.mod`, the
# obvious way to stop the two drifting apart. On 1.27.0 GA the spellings
# coincide and that objection is gone; switching these steps to
# `go-version-file: go.mod` would make the drift impossible rather than
# merely noticed. Left as its own change so a CI restructure is not mixed
# into a version bump.
#
# This must satisfy go.mod's `go` directive. setup-go leaves GOTOOLCHAIN=local,
# which turns "the installed toolchain is too old" into a refusal rather than a
# download — so a pin that drifts below the directive fails every job at once
# instead of quietly fetching what it needs.
env:
  GO_VERSION: '1.27.0'

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, vet, and run the full test suite on every supported platform.
  # Windows is a first-class target here: the index is memory-mapped, and on
  # Windows this package maps it itself (index_mmap_windows.go),
  # and the Sync/Close/Shrink paths use FlushFileBuffers + SetEndOfFile — all
  # of which only fail on Windows, so it must be exercised in CI.
  #
  # On the -timeout: TestConsolidationOperationalEquivalence measured ~156s of
  # the suite's ~167s locally (six torture runs of 9000 steps), so wall-clock
  # here is essentially that one test, and it is filesystem-bound — 22s on a
  # Linux runner against minutes on Windows. Observed Windows runs range from
  # ~4m to ~12m45s on identical code, purely on runner luck. go test's 10m
  # default would have failed the 12m45s run with nothing actually wrong, so
  # the explicit timeout is what keeps a slow runner from reading as a defect.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout=30m ./...

  # The race detector on Linux, where cgo + gcc are always available. Covers the
  # concurrent paths: the index map/unmap swap on expand, the process-wide RemoteIndexCache
  # LRU, and offload read-through under contention (offload_concurrency_test.go).
  race:
    name: race (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test (race)
        run: go test -race -count=1 -timeout=50m ./...

  # The same detector on Windows, which nothing covered until now: the job above
  # is Linux-only and `test (windows-latest)` runs without -race. That was the
  # gap most likely to hold something, because every platform-specific defect
  # this log has had was a Windows one — the mmap flush/truncate ordering, and
  # the just-killed-handle window that breaks reads as well as writes.
  #
  # It is worth doing per push rather than nightly because it is nearly free in
  # the only currency that matters here, WALL CLOCK: jobs run in parallel, and
  # at ~806s this becomes the critical path in place of `test (windows-latest)`
  # at ~683s. Two minutes, for catching a race at the commit that introduced it
  # instead of the next morning.
  #
  # -race needs cgo and a C compiler; the runner image ships mingw-w64. If that
  # stops being true the race build fails with a linker error that says nothing
  # about the cause, so the toolchain is recorded first.
  race-windows:
    name: race (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Toolchain
        run: |
          go env CGO_ENABLED CC
          gcc --version
      - name: Test (race)
        run: go test -race -count=1 -timeout=50m ./...

  # Formatting, vet, and module integrity. .gitattributes stores *.go with LF,
  # so gofmt (which normalizes to LF) agrees on every runner.
  format:
    name: gofmt + vet + mod + staticcheck + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod verify
        run: go mod verify
      # go vet is deliberately narrow — it reports only what is almost certainly
      # a mistake. These three checks cover what it leaves: dead unexported code
      # (U1000), the simplifications (S1*), and the correctness set (SA*), which
      # is where the one finding worth having came from. Pinned, and installed
      # through the module proxy for the same reason actionlint is.
      #
      # Not the default check set: ST* is a naming and comment-style opinion this
      # repo does not share, and turning it on would mean either a large
      # reformat or an exclusion list that has to be maintained. Three families
      # that only ever fire on something real keeps a green here meaningful.
      #
      # The pin tracks the TOOLCHAIN, not just our taste in versions. staticcheck
      # reads the compiler's export data, and Go 1.27 emits format version 4
      # while v0.7.0 tops out at 2 — so the move to go1.27rc2 turned this step
      # into "internal error in importing internal/byteorder ... please report an
      # issue" for every stdlib package, which reads like a staticcheck bug and
      # is not one. v0.8.0-rc.1 is the release that understands 1.27, so an rc
      # toolchain gets an rc analyzer; both drop their suffix together at GA.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
          "$(go env GOPATH)/bin/staticcheck" -checks 'U1000,S1*,SA*' ./...
      # Not the comment-style opinion declined just above. ST1020 asks whether a
      # doc comment is well-formed; this asks whether it is attached to the right
      # function, which is a correctness question in a package where the comments
      # carry the contracts. A rename or a move leaves the doc behind and nothing
      # else in this job notices. The first sweep found six, one of them a whole
      # doc block stranded on an unrelated function.
      - name: docdrift
        run: bash hack/docdrift.sh
      # docs/layering.md describes a stack the compiler cannot enforce, since
      # everything outside compress/ is one package. It used to defend itself
      # with a count of files naming *commitLog, which drifted from six to ten
      # while the layering stayed intact — the count was measuring how the
      # methods are spread across files, not which way the dependencies point.
      # This checks the direction, and fails on a new file that is in neither
      # half rather than letting it escape the rule by not being mentioned.
      - name: layercheck
        run: bash hack/layercheck.sh
      # An atomic write is not a durable one: the library ends with a rename,
      # and the name is only durable once the DIRECTORY is fsynced. Two files
      # wrote through the library directly and so promised a durability they did
      # not deliver — one of them the descriptor, whose loss leaves a directory
      # of segments that will not open again. The rule had been written down, in
      # a doc comment listing the callers it covered, and a hand-written list
      # cannot notice a caller that never joins it.
      - name: atomicwrite
        run: bash hack/atomicwrite.sh
      # The segment slice is shared with every reader, unlocked, so a change to
      # the set publishes a new array instead of writing into the old one. Both
      # breaks of that rule were writes that did not look like writes — an
      # element assignment in TruncateBefore (v0.44.2), and a sort.Slice in the
      # manifest adopt, which swaps in place. The second could not have been
      # caught by a test: it runs inside open(), where no reader exists to lose
      # the race, so it was safe by the schedule and not by the code.
      - name: cowsegments
        run: bash hack/cowsegments.sh
      # A size a caller's store reported must be bounded before it becomes a
      # length. Both ends are damage and only one is an error: a negative size is
      # `makeslice: len out of range` — a panic, in the caller's process, out of a
      # library — and a large one is allocated in full before a byte is parsed.
      # The parser's own checks all run on the buffer AFTER it exists, so none of
      # them can protect the number that made it. Three of the four readers had
      # the check, each written separately by someone who had just been bitten;
      # fetchBlockTable arrived later and had none, and nothing could notice,
      # because a hand-copied rule is invisible to the copy nobody makes.
      - name: storesize
        run: bash hack/storesize.sh
      # Every on-disk format carries a version and every reader refuses one it
      # does not recognise, and that refusal needs TWO things held, which are
      # different claims: that the version line is checked, and that the
      # constant moved when the layout did. A check that runs against the wrong
      # number is still a check that runs — #300 had the first and not the
      # second, so every v0.88.0 manifest decoded with TierObject.Records absent
      # (which JSON gives as zero) and a retention budget summing record counts
      # stopped reaching its ceiling at all.
      #
      # guardcheck holds both, one guard each. What did not work was REMEMBERING
      # to add them: six formats carry a version and three had neither guard.
      # This makes the next one mechanical — a version constant compared in a
      # refusal must be named by a guard, or the build is red.
      #
      # It also refuses to report at all when a version is compared whose
      # DECLARATION its scan did not find, because the first draft of it did
      # exactly that: manifestVersion is declared outside a const block, so the
      # scan skipped it and the script reported five of five held while silently
      # omitting the one format it was written about.
      - name: formatversion
        run: bash hack/formatversion.sh
      # Every refusal New makes about the caller's Options carries
      # ErrInvalidOptions, so a caller opening on a retry loop can tell a
      # permanent condition from a busy disk. Checked in the SOURCE rather than
      # by a test, because a test only covers the refusals someone wrote down
      # and the risk is the one they did not.
      - name: openerrors
        run: bash hack/openerrors.sh
      # Every exported sentinel is either in the CommitLog remedy list or says
      # at its declaration why a caller never sorts on it. openerrors.sh checks
      # that New's refusals CARRY a sentinel; this checks that every sentinel
      # tells a caller what to do with it. The list it guards replaced a prose
      # rule that had drifted false, and was itself already missing six
      # caller-facing sentinels on the day it was written — a list is not a
      # closed set just because it is a list, so this closes it from the
      # declarations.
      - name: sentinels
        run: bash hack/sentinels.sh
      # The eight scripts above and guardcheck decide whether this repo is
      # correct, and until now nothing checked THEM. Every bug they have had was
      # shell semantics rather than logic: a `| while` setting its flag in a
      # subshell so layercheck printed every violation and exited 0; a substring
      # filter taken for a regex; `go test -run` selecting nothing and reading as
      # a pass; and `printf | grep -q` under pipefail, where grep exiting early
      # gave printf EPIPE and turned a guard that WAS covered into a red. A
      # correctness checker that returns the wrong verdict is worse than not
      # having one.
      #
      # Free to run: the actionlint step below already asserts shellcheck is on
      # the runner, so there is nothing to install and its absence is already
      # loud. severity=warning rather than the default, which is style-level and
      # would be argued with instead of fixed.
      #
      # The optional check-extra-masked-returns (SC2312) was considered for the
      # pipefail bug above and rejected, so it does not get proposed again: it
      # flags a command SUBSTITUTION whose exit status is discarded, and that bug
      # was a PIPELINE whose status was the whole condition — nothing masked, so
      # it would not have fired. What it would flag here is `cd "$(dirname $0)"`
      # and `echo "... $(wc -l)"`, roughly a dozen of them, none a defect. The
      # real fix for that class is structural and is already applied: neither
      # script pipes into `grep -q` any more, so no `set` line has to stay absent
      # for them to be correct.
      - name: shellcheck hack scripts
        run: shellcheck --severity=warning hack/*.sh
      # Static check of the workflows themselves: bad expressions, unknown
      # action inputs, and — via shellcheck, preinstalled on the runner — the
      # `run:` blocks. Pinned and fetched through the module proxy rather than
      # curl-pipe-bash, since setup-go is already here. Caught nothing on the
      # current files; it is here so a future edit fails cheaply instead of
      # burning a run to discover a typo'd expression.
      - name: actionlint
        run: |
          # actionlint DISABLES its shell-linting rule and still exits 0 when
          # the shellcheck binary is missing, so a green here can silently mean
          # "linted the workflow syntax but none of the run: blocks". Assert it
          # up front: if a runner image ever stops shipping it, fail loudly
          # instead of quietly checking less.
          # (Careful: a comment line starting with the word shellcheck is
          # parsed as a shellcheck directive, so keep it mid-sentence.)
          shellcheck --version > /dev/null
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # Does each guard have a test that actually fails without it? Fuzzing explores
  # INPUTS and cannot answer that, so a test asserting the wrong property reads
  # as coverage indefinitely — this repo shipped a defect behind exactly such a
  # test. guardcheck removes each guard and requires its named test to go red.
  # Cheap: one targeted test run per guard, not the whole suite.
  #
  # The ceiling is 45 rather than 20 because this job's cost GROWS with the guard
  # registry while the ceiling does not, and crossing it does not report as a
  # failure — it reports `cancelled`, which a `!= "failure"` filter calls clean, a
  # human reads as red, and a release cannot be tagged on. That is not
  # hypothetical: the fuzz smoke budget below hit exactly this on the v0.92.0
  # candidate, in the same run that prompted this measurement.
  #
  # Measured 2026-08-17 at 228 guards: 886s and 906s on two consecutive runs, so
  # ~4s per guard and 75% of a 20-minute ceiling already spent. The count has gone
  # 22 -> 144 -> 228 and this release added four, so the old ceiling was ~70 guards
  # from deciding a release. 45 covers roughly double the current registry.
  #
  # Raising the ceiling rather than splitting the set, deliberately: at 15 minutes
  # this job is not the critical path — `race (windows)` runs 11-32 minutes — so
  # sharding would add matrix machinery to speed up something nothing waits on. If
  # a split ever happens, do it for FEEDBACK (a failing guard reported in 2 minutes
  # instead of 15), not for the ceiling.
  #
  # `guard coverage (windows)` below keeps 20: it runs only the platform subset via
  # GUARDCHECK_SET and measured 109-122s, so it has an order of magnitude of room.
  guards:
    name: guard coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Invoked through bash rather than as a bare command. The script carries a
      # shebang and its mode bit is now 100755, so `hack/guardcheck.sh` would
      # work — but this repo is developed on Windows, where the filesystem has
      # no executable bit for git to preserve, so a future commit can drop it
      # again without anyone touching this file. It had in fact never been set:
      # this job failed with "Permission denied" (exit 126) from the day it was
      # added, so every guard it claimed to check went unchecked, which is a
      # worse failure than the one it exists to prevent.
      - name: guardcheck
        run: bash hack/guardcheck.sh

  # The guards the job above CANNOT check. A guard inside a `//go:build windows`
  # file is not merely skipped on Linux — the file is not compiled, the test
  # named for it does not exist, and `go test -run` with nothing to run exits 0,
  # which guardcheck reads as "passed without the guard". So those guards are
  # deferred there and falsified here, on the OS they are written for.
  #
  # GUARDCHECK_SET=platform runs ONLY them, so this is a couple of test runs
  # rather than the full 15-minute sweep, and it fails rather than passes if it
  # finds none to run — a job that checks nothing looks exactly like one that
  # checked everything.
  guards-windows:
    name: guard coverage (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: guardcheck
        shell: bash
        env:
          GUARDCHECK_SET: platform
        run: bash hack/guardcheck.sh

  # A short active fuzzing sweep on top of the seed corpus (the seeds already run
  # as normal subtests in the `test` job). Bounded so it stays a smoke test; a
  # crasher fails the job and is written to testdata/fuzz for a maintainer to pull.
  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One execution budget per target, because a single count cannot be
        # right for all of them: these targets differ by an order of magnitude
        # per execution, FuzzCompactionRecovery building and recovering a whole
        # log each time. A flat 20000 gave it 11 minutes and gave the cheapest
        # target 61 seconds.
        #
        # Each count is sized from the SLOWEST rate that target has been
        # observed at, not its average, so ~90s — what this job used to spend —
        # is the worst case rather than the lucky one. That distinction is the
        # whole tuning rule, because throughput is not stable run to run: as the
        # corpus grows, observed rates moved by up to 5x between two consecutive
        # runs (FuzzOffloadCrashConsistency 42/sec then 222/sec,
        # FuzzOffloadCompactionRetention 149/sec then 35/sec). Sizing from one
        # sample is fitting noise, and doing exactly that is what produced a
        # 414s job here.
        #
        # So these bound WORK, and wall clock varies by design; the job timeout
        # above is what bounds a slow runner. To re-tune, subtract the ~40s of
        # checkout, toolchain and build from a job's duration and divide — then
        # keep the lower of that and the count already here.
        #
        # The 5x above is understated, and a budget that only fits at the fast end
        # spends the timeout instead of reporting. On 2026-08-17
        # FuzzCorruptedRecordIsNeverServedSilently ran at 9/sec against the ~120/sec
        # its 11000 was sized from — a 13x spread — and was CANCELLED by the job
        # timeout 342 execs short, on the release candidate for v0.92.0, while the
        # other five targets in the same run came in at their usual 62-164s. Two
        # things follow, and the second is the one that matters.
        #
        # A timeout cancellation is indistinguishable at a glance from a real red,
        # and it blocks a tag. So the count must fit at the SLOW end, or the job's
        # verdict is a coin flip on runner speed.
        #
        # And the target that blew up was not the only one exposed — it was the one
        # that got unlucky. Sizing each remaining count against 1/13th of its own
        # observed fast rate, three of six could exceed the 20-minute timeout:
        # CorruptedRecord 24min, CorruptDigest 22min, TornLog 19min. Fixing only
        # the one that happened to fail would have left the identical fault in two
        # siblings for the next release to find, so the rule is applied to all of
        # them: worst case at 1/13th of the fast rate must fit in HALF the timeout,
        # which leaves the timeout as the backstop it is meant to be rather than
        # the thing that decides the result. That is what moved CorruptedRecord
        # 11000 -> 3000, CorruptDigest 20000 -> 8000, TornLog 23000 -> 10000 and
        # CompactionRecovery 3000 -> 2500 (its 10.7min worst case was already over
        # half). The two Offload targets are 7.4 and 6.7min and stay as they are.
        #
        # CorruptFrameHeader joined on 2026-08-18. It was excluded when it was
        # committed SKIPPED, documenting a gap that readOne's offset bounds check
        # and the header CRC have since closed; the skip went and the exclusion
        # did not. Sized by the same rule from a measured 47/sec: 1/13th is
        # 3.6/sec, and 2000 execs is a 9.3min worst case.
        #
        # This trades smoke-test volume for a job that reports rather than times
        # out; volume belongs in the nightly `Fuzz (deep)` run, which is bounded by
        # wall clock and has no tag waiting on it.
        include:
          - {target: FuzzCompactionRecovery, execs: 2500}
          - {target: FuzzOffloadCompactionRetention, execs: 3000}
          - {target: FuzzOffloadCrashConsistency, execs: 4000}
          - {target: FuzzCorruptedRecordIsNeverServedSilently, execs: 3000}
          - {target: FuzzCorruptDigestNeverChangesTheAnswer, execs: 8000}
          - {target: FuzzTornLogServesOnlyAPrefix, execs: 10000}
          - {target: FuzzCorruptFrameHeaderIsNeverServedAsTruth, execs: 2000}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Bounded by EXECUTIONS, not by wall clock, and the difference is not a
      # preference. A duration budget makes the fuzzing coordinator run under a
      # context with a deadline, and a worker still executing when that deadline
      # lands surfaces the cancellation as a test failure: a bare "context
      # deadline exceeded" at exactly elapsed 1m30s, with no failing input
      # written to testdata/fuzz. That is a red job with nothing to pull, on any
      # target, and it cost re-runs on green commits. An execution budget builds
      # no deadline at all, so there is nothing to race. It also makes the smoke
      # test do the same WORK on every runner rather than the same wall clock,
      # which is what a fixed budget was for; the job timeout above is what keeps
      # a slow runner bounded.
      - name: Fuzz ${{ matrix.target }} (${{ matrix.execs }} execs)
        run: go test -run '^$' -fuzz='^${{ matrix.target }}$' -fuzztime=${{ matrix.execs }}x -timeout=15m .
